<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SUMI — アンケート回答一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Noto+Sans+JP:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
/* 回答一覧。上に集計（A案・B案別）、下に1件ずつの回答。ブックと同じ黒地で揃える */
:root {
  --bg: #161616; --card: #1e1d1b; --ink: #edeae5;
  --ink-60: rgba(237, 234, 229, 0.62); --ink-45: rgba(237, 234, 229, 0.45);
  --hair: rgba(237, 234, 229, 0.16); --bar-a: #c9bfae; --bar-b: #8f9a9c;
  --serif: "Shippori Mincho", "Hiragino Mincho ProN", serif;
  --sans: "Noto Sans JP", "Hiragino Sans", sans-serif;
  --latin: "Jost", "Helvetica Neue", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 300; line-height: 1.7; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 40px 80px; display: grid; gap: 40px; }
section, header { min-width: 0; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.logo { width: 80px; display: block; margin-bottom: 18px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: 26px; letter-spacing: 0.08em; margin: 0; }
h2 { font-family: var(--serif); font-weight: 500; font-size: 18px; letter-spacing: 0.08em; margin: 0 0 16px; }
.btn { border: 1px solid var(--hair); background: none; color: var(--ink); font: inherit; padding: 10px 16px; cursor: pointer; }
.btn:hover { border-color: var(--ink-45); }
.counts { display: flex; flex-wrap: wrap; gap: 12px; }
.count { background: var(--card); border: 1px solid var(--hair); padding: 16px 20px; min-width: 140px; }
.count b { display: block; font-family: var(--latin); font-weight: 400; font-size: 30px; font-variant-numeric: tabular-nums; }
.count span { font-size: 12px; color: var(--ink-60); letter-spacing: 0.08em; }
.legend { display: flex; gap: 18px; font-size: 12px; color: var(--ink-60); margin-bottom: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
.summary { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.sum { background: var(--card); border: 1px solid var(--hair); padding: 18px; min-width: 0; }
.sum h3 { font-family: var(--serif); font-weight: 400; font-size: 14px; line-height: 1.7; margin: 0 0 12px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 12px; margin-bottom: 10px; }
.row__label { color: var(--ink-60); }
.row__num { font-family: var(--latin); font-variant-numeric: tabular-nums; color: var(--ink-60); }
.bars { grid-column: 1 / -1; display: grid; gap: 3px; }
.bar { height: 5px; background: rgba(237, 234, 229, 0.06); }
.bar i { display: block; height: 100%; }
.table-scroll { overflow-x: auto; border: 1px solid var(--hair); }
table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--hair); }
th { font-weight: 400; color: var(--ink-60); font-size: 12px; min-width: 160px; background: var(--card); }
th:nth-child(-n+3) { min-width: 0; white-space: nowrap; }
td { min-width: 120px; max-width: 280px; }
td.n { min-width: 0; font-family: var(--latin); font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty, .error { color: var(--ink-60); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <img class="logo" src="../assets/img/logo-white.svg" alt="SUMI">
      <h1>アンケート回答一覧</h1>
    </div>
    <button class="btn" id="csv" type="button">CSVで書き出す</button>
  </header>

  <section>
    <div class="counts" id="counts"><p class="empty">読み込んでいます…</p></div>
  </section>

  <section>
    <h2>選択式の質問の集計</h2>
    <div class="legend"><span><i style="background:var(--bar-a)"></i>A案</span><span><i style="background:var(--bar-b)"></i>B案</span></div>
    <div class="summary" id="summary"></div>
  </section>

  <section>
    <h2>すべての回答</h2>
    <div class="table-scroll"><table id="table"></table></div>
  </section>
</div>

<script src="../assets/js/content.js"></script>
<script>
(function () {
  "use strict";
  var S = window.SUMI_SURVEY;
  var QS = [];
  // 表の列。選択式・記入の答えに加え、質問に添えた記入欄（香り・理由・金額）も1列ずつにする
  var COLS = [];
  S.sections.forEach(function (sec) {
    sec.questions.forEach(function (q) {
      QS.push(q);
      if (q.type !== "fields") COLS.push({ id: q.id, label: q.q });
      (q.fields || []).forEach(function (f) {
        COLS.push({ id: f.id, label: f.label });
      });
    });
  });
  var rows = [];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function show(v) {
    if (v == null) return "";
    if (Array.isArray(v)) return v.join("／");
    if (typeof v === "number") return v.toLocaleString("ja-JP") + "円";
    return String(v);
  }
  // 「その他：〇〇」は集計では「その他」にまとめる
  function bucket(v) { return String(v).indexOf(S.other) === 0 ? S.other : String(v); }
  // 保存は世界標準時。日本時間で表示する
  function jst(s) {
    var d = new Date(s.replace(" ", "T") + "Z");
    return d.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  }

  function render() {
    var a = rows.filter(function (r) { return r.variant === "a"; }).length;
    var counts = document.getElementById("counts");
    counts.innerHTML = "";
    [["回答の合計", rows.length], ["A案を見た人", a], ["B案を見た人", rows.length - a]].forEach(function (c) {
      var box = el("div", "count");
      box.appendChild(el("b", null, String(c[1])));
      box.appendChild(el("span", null, c[0]));
      counts.appendChild(box);
    });

    var summary = document.getElementById("summary");
    summary.innerHTML = "";
    var nA = Math.max(a, 1), nB = Math.max(rows.length - a, 1);
    QS.filter(function (q) { return q.type === "single" || q.type === "multi"; }).forEach(function (q) {
      var box = el("div", "sum");
      box.appendChild(el("h3", null, q.q + (q.type === "multi" ? "（複数選択）" : "")));
      var opts = q.options.slice();
      if (q.allowOther) opts.push(S.other);
      opts.forEach(function (o) {
        var ca = 0, cb = 0;
        rows.forEach(function (r) {
          var v = r.answers[q.id];
          if (v == null) return;
          var list = Array.isArray(v) ? v : [v];
          if (list.map(bucket).indexOf(o) !== -1) { if (r.variant === "a") ca++; else cb++; }
        });
        var row = el("div", "row");
        row.appendChild(el("span", "row__label", o));
        row.appendChild(el("span", "row__num", "A " + ca + "　B " + cb));
        var bars = el("div", "bars");
        [[ca, nA, "--bar-a"], [cb, nB, "--bar-b"]].forEach(function (b) {
          var bar = el("div", "bar"), fill = el("i");
          fill.style.width = (b[0] / b[1] * 100) + "%";
          fill.style.background = "var(" + b[2] + ")";
          bar.appendChild(fill); bars.appendChild(bar);
        });
        row.appendChild(bars);
        box.appendChild(row);
      });
      summary.appendChild(box);
    });

    var table = document.getElementById("table");
    table.innerHTML = "";
    if (!rows.length) {
      var tr0 = el("tr"); var td0 = el("td", "empty", "まだ回答はありません。"); tr0.appendChild(td0); table.appendChild(tr0);
      return;
    }
    var head = el("tr");
    ["No", "日時", "見た案"].concat(COLS.map(function (c) { return c.label; })).forEach(function (h) { head.appendChild(el("th", null, h)); });
    table.appendChild(head);
    rows.forEach(function (r) {
      var tr = el("tr");
      tr.appendChild(el("td", "n", String(r.id)));
      tr.appendChild(el("td", "n", jst(r.created_at)));
      tr.appendChild(el("td", "n", r.variant.toUpperCase() + "案"));
      COLS.forEach(function (c) { tr.appendChild(el("td", null, show(r.answers[c.id]))); });
      table.appendChild(tr);
    });
  }

  document.getElementById("csv").addEventListener("click", function () {
    var head = ["No", "日時", "見た案"].concat(COLS.map(function (c) { return c.label; }));
    var lines = [head].concat(rows.map(function (r) {
      return [r.id, jst(r.created_at), r.variant.toUpperCase() + "案"].concat(COLS.map(function (c) { return show(r.answers[c.id]); }));
    })).map(function (cols) {
      return cols.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(",");
    });
    var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv" });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "sumi-survey.csv";
    link.click();
  });

  fetch("data.json", { cache: "no-store", credentials: "same-origin" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) { rows = data; render(); })
    .catch(function () {
      document.getElementById("counts").innerHTML = '<p class="error">回答を読み込めませんでした。ページを再読み込みしてください。</p>';
    });
})();
</script>
</body>
</html>
